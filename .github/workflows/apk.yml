# Compila el APK de CAZATROLO en los servidores de GitHub (gratis).
# Se ejecuta a mano: GitHub → Actions → "Compilar APK" → Run workflow.
name: Compilar APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Falta el secreto VITE_SUPABASE_URL"; exit 1; }
          npm run build
          npx cap sync android

      - name: Restaurar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.CAZATROLO_KEYSTORE_BASE64 }}
          CLAVE: ${{ secrets.CAZATROLO_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Falta el secreto CAZATROLO_KEYSTORE_BASE64"; exit 1; }
          # Ignora espacios y saltos de línea que se cuelan al copiar y pegar
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/cazatrolo.keystore" 2>/dev/null \
            || { echo "::error::El secreto CAZATROLO_KEYSTORE_BASE64 está incompleto o mal copiado. Vuelve a pegar TODO el texto del archivo PEGAR-EN-CAZATROLO_KEYSTORE_BASE64.txt"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/cazatrolo.keystore" -storepass "$CLAVE" -alias cazatrolo >/dev/null 2>&1 \
            || { echo "::error::La llave no abre con la clave de CAZATROLO_KEYSTORE_PASSWORD. ¿Cambiaste la clave después de crear la llave? Vuelve a correr 'Crear llave de firma' y pega el nuevo texto."; exit 1; }

      - name: Compilar APK
        working-directory: android
        env:
          CAZATROLO_KEYSTORE: ${{ runner.temp }}/cazatrolo.keystore
          CAZATROLO_KEYSTORE_PASSWORD: ${{ secrets.CAZATROLO_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log
          estado=${PIPESTATUS[0]}
          set -e
          if [ "$estado" -ne 0 ]; then
            # Muestra el motivo del error como anotación (visible en el resumen)
            motivo=$(grep -A 12 "What went wrong" gradle.log | head -14 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$motivo" ] && motivo=$(tail -25 gradle.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::$motivo"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CAZATROLO-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: CAZATROLO-v${{ github.run_number }}
          path: CAZATROLO-v*.apk
          retention-days: 30
